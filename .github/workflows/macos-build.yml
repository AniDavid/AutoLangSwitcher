# Compiles the macOS app on a GitHub Mac, since the author doesn't have one.
# Checks that it compiles and runs the word-check self-test; it doesn't test the rest of the app.
name: macOS build

on:
  push:
    paths: ["macOS/**", ".github/workflows/macos-build.yml"]
  pull_request:
    paths: ["macOS/**"]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        working-directory: macOS
        run: |
          swiftc --version
          swiftc -O -parse-as-library -o AutoLangSwitcher *.swift -framework Cocoa -framework Carbon
      - name: Self-test (Smart Keyboard Auto Switch word checks)
        working-directory: macOS
        run: ./AutoLangSwitcher --selftest
